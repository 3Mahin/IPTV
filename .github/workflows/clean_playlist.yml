name: Advanced Stream Processor

on:
  schedule:
    - cron: "0 */8 * * *" # Automatically processes streams every 8 hours
  workflow_dispatch:      # Manual trigger button

jobs:
  check-streams:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install requests urllib3

      - name: Run stream processor
        run: python process_streams.py

      - name: Commit changes
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "<>"
          git add tv.m3u processed_cache.json streams/
          
          # Commit and push only if modifications are found
          git diff --staged --quiet || (git commit -m "Automated: Updated stream paths and proxy configurations" && git push) || echo "Nothing new to push"
