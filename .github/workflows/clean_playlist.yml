name: Auto Clean tv.m3u Playlist

on:
  schedule:
    - cron: '0 0 * * *' # Automatically runs daily at midnight UTC
  workflow_dispatch:   # Gives you a "Run workflow" button in the GitHub actions UI

jobs:
  check-and-clean:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install aiohttp

    - name: Execute Link Checker Script
      run: python check_m3u.py

    - name: Commit and Push changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add tv.m3u
        
        if git diff --staged --quiet; then
          echo "No dead links found. tv.m3u is fully active!"
        else
          git commit -m "Automated: Cleaned up dead links from tv.m3u"
          git push
        fi
